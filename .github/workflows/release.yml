name: release

# 打 tag（v1.0.0 这种形式）就自动发一个 GitHub Release：
# 跑测试 -> 打包 zip -> 创建 Release 并挂上附件。
# 用 runner 自带的 gh CLI，不引入第三方 action。
on:
  push:
    tags:
      - "v*"
  # 附件传失败或者想改发布说明时可以手动重跑
  workflow_dispatch:
    inputs:
      tag:
        description: 要重新发布的标签，例如 v1.0.0
        required: true
        type: string

# 只有这个 job 需要写 Releases 的权限，收紧到 contents: write
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 测试里包含"标签版本 == 插件 version == package.json version"这一类断言，
      # 所以在打包之前先跑一遍；失败就不要发出一个装不上的包。
      - name: Run tests
        run: |
          npm test
          if [ "${{ github.event_name }}" = "push" ]; then
            [ "$TAG" = "v$(node -p "require('./package.json').version")" ] \
              || { echo "标签 $TAG 与 package.json 的版本号不一致"; exit 1; }
          fi

      - name: Package plugin folder
        run: |
          mkdir -p dist
          cp -R LyricsFiller "dist/LyricsFiller"
          (cd dist && zip -r -q "LyricsFiller-$TAG.zip" LyricsFiller)
          ls -l dist
          unzip -l "dist/LyricsFiller-$TAG.zip"

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          从剪贴板读取歌词，按语言规则切分为音节单元，顺序填入选定声部的音符下方。
          中文一字一音，英文按连字符分音节，连音线与延音线覆盖的音符只在首音填词。

          ## 安装

          1. 下载 `LyricsFiller-vX.Y.Z.zip`，解压。
          2. 将 `LyricsFiller` 文件夹放入 MuseScore 用户插件目录：
             - Windows：`文档\MuseScore4\Plugins`
             - macOS / Linux：`~/Documents/MuseScore4/Plugins`
          3. 退出并重新启动 MuseScore。插件列表中的 "Reload plugins" 只重扫列表，
             不会加载修改后的代码。

          之后菜单中出现 **插件 → 歌词 → Lyrics Filler 自动填词**。

          Windows 的"文档"目录常被重定向。找不到插件时，以
          编辑 → 偏好设置 → 扩展 中"我的插件"显示的路径为准。
          附件中的单个 `lyricsfiller.qml` 可直接放入 `Plugins` 目录，同样能被识别。

          ## 用法

          复制歌词 → 选中目标音符 → 打开插件（歌词自动填入）→ **统计** 核对数量 → **应用**。

          一次 **Ctrl+Z** 撤销整批写入。多段歌词需逐段填写（修改"第几段歌词"序号）。

          ## 更新内容

          见 [CHANGELOG.md](../main/CHANGELOG.md)。完整的分词规则、选项说明与
          常见问题见 README。

          ## 隐私

          插件离线运行：无网络请求与遥测，不上传歌词或乐谱，不保留剪贴板内容。
          实现为单个 `lyricsfiller.qml` 文件，可直接审计。

          开发过程使用 AI 辅助；所有 MuseScore API 行为均在
          MuseScore Studio 4.7.5 上逐项实测，并写成回归测试。
          EOF

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS=(
            "$TAG"
            "dist/LyricsFiller-$TAG.zip"
            LyricsFiller/lyricsfiller.qml
            --title "Lyrics Filler $TAG"
            --notes-file release-notes.md
            --latest
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 重跑 workflow 时不重复创建，改为覆盖附件并刷新说明
            gh release edit "$TAG" --notes-file release-notes.md --latest
            gh release upload "$TAG" "dist/LyricsFiller-$TAG.zip" LyricsFiller/lyricsfiller.qml --clobber
          else
            gh release create "${ARGS[@]}"
          fi
          gh release view "$TAG"
