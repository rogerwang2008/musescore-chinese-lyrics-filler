name: release

# 打 tag（v1.0.0 这种形式）就自动发一个 GitHub Release：
# 跑测试 -> 打包 zip -> 创建 Release 并挂上附件。
# 用 runner 自带的 gh CLI，不引入第三方 action。
on:
  push:
    tags:
      - "v*"
  # 附件传失败或者想改发布说明时可以手动重跑
  workflow_dispatch:
    inputs:
      tag:
        description: 要重新发布的标签，例如 v1.0.0
        required: true
        type: string

# 只有这个 job 需要写 Releases 的权限，收紧到 contents: write
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 测试里包含"标签版本 == 插件 version == package.json version"这一类断言，
      # 所以在打包之前先跑一遍；失败就不要发出一个装不上的包。
      - name: Run tests
        run: |
          npm test
          if [ "${{ github.event_name }}" = "push" ]; then
            [ "$TAG" = "v$(node -p "require('./package.json').version")" ] \
              || { echo "标签 $TAG 与 package.json 的版本号不一致"; exit 1; }
          fi

      - name: Package plugin folder
        run: |
          mkdir -p dist
          cp -R LyricsFiller "dist/LyricsFiller"
          (cd dist && zip -r -q "LyricsFiller-$TAG.zip" LyricsFiller)
          ls -l dist
          unzip -l "dist/LyricsFiller-$TAG.zip"

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          把歌词复制到剪贴板，插件按语言规则切成音节，顺序填进你选定声部的音符下方。
          中文一字一音，英文按连字符分音节，连音线上的多个音符只在第一个音填词。

          ## 安装（约 1 分钟）

          1. 下载 `LyricsFiller-vX.Y.Z.zip`，解压。
          2. 把解压出来的 **`LyricsFiller` 整个文件夹**放进 MuseScore 的用户插件目录：
             - Windows：`文档\MuseScore4\Plugins`
             - macOS / Linux：`~/Documents/MuseScore4/Plugins`
          3. **完全退出 MuseScore 再重开。**
             插件列表里的 "Reload plugins" 只重扫列表，不会加载新代码。

          然后菜单里就有 **插件 → 歌词 → Lyrics Filler 自动填词**。

          > Windows 上"文档"常被重定向（OneDrive，或整个搬到别的盘）。
          > 装完找不到插件时，去 编辑 → 偏好设置 → 扩展 看"我的插件"到底是哪个目录，
          > 以它为准，不要凭 `C:\Users\<你>\Documents` 猜。
          > 附件里也有单个 `lyricsfiller.qml`，直接丢进 `Plugins` 目录同样能被识别。

          ## 用法

          1. 复制歌词 → 2. 选中要填词的音符 → 3. 打开插件（歌词会自动出现）
          → 4. 点 **统计** 确认音节数与音符数 → 5. 点 **应用**。

          结果不满意：**Ctrl+Z** 一次撤销整批写入。多段歌词请逐段填（改"第几段歌词"）。

          ## 这一版改了什么

          看 [CHANGELOG.md](../main/CHANGELOG.md) —— 只列对用户有影响的变化。
          完整的分词规则、选项说明与常见问题在 README 里。

          ## 隐私

          插件**完全离线**：没有网络请求、没有遥测，不上传歌词或乐谱，
          也不保留剪贴板内容。整个插件就是一个可读的 `lyricsfiller.qml` 文件。

          开发过程使用了 AI 辅助编码，但所有 MuseScore API 行为都在
          MuseScore Studio 4.7.5 上实测验证并写成了回归测试。
          EOF

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS=(
            "$TAG"
            "dist/LyricsFiller-$TAG.zip"
            LyricsFiller/lyricsfiller.qml
            --title "Lyrics Filler $TAG"
            --notes-file release-notes.md
            --latest
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 重跑 workflow 时不重复创建，改为覆盖附件并刷新说明
            gh release edit "$TAG" --notes-file release-notes.md --latest
            gh release upload "$TAG" "dist/LyricsFiller-$TAG.zip" LyricsFiller/lyricsfiller.qml --clobber
          else
            gh release create "${ARGS[@]}"
          fi
          gh release view "$TAG"
